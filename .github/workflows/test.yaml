name: Test
on:
  push:
    branches:
      - main
      - develop
  pull_request:
jobs:
  unit-test-bzlmod:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp:
        - "25.3"
        - "26.2"
    steps:
    - name: CHECKOUT
      uses: actions/checkout@v7
    - name: CONFIGURE ERLANG
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
    - name: UNIT TEST
      run: |
        ERLANG_HOME="$(dirname $(dirname $(which erl)))"
        bazelisk build //... \
          --color=yes
  test-bzlmod:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        otp:
        - "25.3"
        - "26.2"
    steps:
    - name: CHECKOUT
      uses: actions/checkout@v7
    - name: CONFIGURE ERLANG
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
    - name: TEST
      working-directory: test
      run: |
        bazelisk test //... \
          --color=yes
    - name: RESOVLE TEST LOGS PATH
      if: always()
      working-directory: test
      run: |
        echo "LOGS_PATH=$(readlink -f bazel-testlogs)" >> $GITHUB_OUTPUT
      id: resolve-test-logs-path
    - name: CAPTURE TEST LOGS
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: bazel-testlogs-bzlmod-${{matrix.otp}}
        path: ${{ steps.resolve-test-logs-path.outputs.LOGS_PATH }}/*
  test-bzlmod-macos:
    runs-on: macos-15
    steps:
    - name: CHECKOUT
      uses: actions/checkout@v7
    - name: CONFIGURE ERLANG
      run: |
        brew install erlang
    - name: TEST
      working-directory: test
      run: |
        ERLANG_HOME="$(dirname $(dirname $(which erl)))"
        bazelisk test //... \
          --color=yes
    - name: RESOVLE TEST LOGS PATH
      if: always()
      working-directory: test
      run: |
        echo "LOGS_PATH=$(readlink -f bazel-testlogs)" >> $GITHUB_OUTPUT
      id: resolve-test-logs-path
    - name: CAPTURE TEST LOGS
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: bazel-testlogs-bzlmod-macos
        path: ${{ steps.resolve-test-logs-path.outputs.LOGS_PATH }}/*
  check-buildbuddy-secret:
    runs-on: ubuntu-24.04
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
    - id: check
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        if [ -n "$BUILDBUDDY_API_KEY" ]; then
          echo "has-key=true" >> $GITHUB_OUTPUT
        else
          echo "has-key=false" >> $GITHUB_OUTPUT
        fi
  test-bzlmod-internal-erlang:
    runs-on: ubuntu-24.04
    needs: check-buildbuddy-secret
    if: needs.check-buildbuddy-secret.outputs.has-key == 'true'
    steps:
    - name: CHECKOUT
      uses: actions/checkout@v7
    - name: CONFIGURE BAZEL
      working-directory: test
      env:
        BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      run: |
        cat << EOF >> user.bazelrc
          build:buildbuddy --remote_download_minimal
          build:buildbuddy --color=yes
          build:buildbuddy --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
        EOF
    - name: BUILD
      working-directory: test
      run: |
        bazelisk build @rules_erlang//tools:erlang_headers \
          --config=rbe \
          --toolchain_resolution_debug="@rules_erlang.*" \
          --verbose_failures
    - name: TEST
      working-directory: test
      run: |
        bazelisk test //... \
          --config=rbe \
          --toolchain_resolution_debug="@rules_erlang.*" \
          --verbose_failures \
          --build_tests_only
    - name: RESOVLE TEST LOGS PATH
      if: always()
      working-directory: test
      run: |
        echo "LOGS_PATH=$(readlink -f bazel-testlogs)" >> $GITHUB_OUTPUT
      id: resolve-test-logs-path
    - name: CAPTURE TEST LOGS
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: bazel-testlogs-bzlmod-internal-erlang
        path: ${{ steps.resolve-test-logs-path.outputs.LOGS_PATH }}/*
  test-bzlmod-coverage:
    runs-on: ubuntu-24.04
    steps:
    - name: CHECKOUT
      uses: actions/checkout@v7
    # - name: INSTALL LCOV
    #   run: |
    #     sudo apt-get install -y lcov
    - name: CONFIGURE ERLANG
      uses: erlef/setup-beam@v1
      with:
        otp-version: 26
    - name: COVERAGE
      working-directory: test
      run: |
        bazelisk coverage --combined_report=lcov //...
    # - name: GENHTML
    #   working-directory: test
    #   run: |
    #     head "$(bazel info output_path)/_coverage/_coverage_report.dat"
    #     genhtml --output genhtml "$(bazel info output_path)/_coverage/_coverage_report.dat"
    - name: RESOVLE TEST LOGS PATH
      if: always()
      working-directory: test
      run: |
        echo "LOGS_PATH=$(readlink -f bazel-testlogs)" >> $GITHUB_OUTPUT
      id: resolve-test-logs-path
    - name: CAPTURE TEST LOGS
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: bazel-testlogs-bzlmod-coverage
        path: ${{ steps.resolve-test-logs-path.outputs.LOGS_PATH }}/*
  summary:
    needs:
    - unit-test-bzlmod
    - test-bzlmod
    - test-bzlmod-macos
    - test-bzlmod-internal-erlang
    - test-bzlmod-coverage
    runs-on: ubuntu-latest
    steps:
    - name: SUMMARY
      run: |
        cat << 'EOF' | jq -e 'map(.result == "success" or .result == "skipped") | all(.)'
        ${{ toJson(needs) }}
        EOF
